<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Declaration Report</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="data.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      color: #f0b429;
      margin-bottom: 5px;
    }

    h3 {
      text-align: center;
      margin-top: 0;
      font-weight: normal;
      color: #555;
    }

    .section-title {
      background: #111;
      color: #f0b429;
      padding: 12px;
      font-size: 18px;
      margin-top: 30px;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
    }

    td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    td.label {
      background: #333;
      color: white;
      font-weight: bold;
      width: 35%;
    }

    img {
      max-width: 400px;
      margin-top: 15px;
      border: 3px solid #333;
      border-radius: 6px;
    }

    .score-low {
      color: red;
      font-weight: bold;
    }

    .score-ok {
      color: green;
      font-weight: bold;
    }

    button {
      margin-top: 25px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    @media print {
      button { display: none; }
      body { background: white; }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>

<body class="doc">
<div class="doc-sheet">

<h1>Safety Declaration Report</h1>
<h3>Chenab Engineering Works</h3>

<div id="reportContent">Loading...</div>

<button onclick="window.print()">Print / Save as PDF</button>

<script>

/* Permit to Work section (CEWF-IMS-FRM-043), shown when the record has ptw data */
function ptwHtml(data) {
  const p = data.ptw;
  if (!p) return "";
  const nature = ["Hot Work", "Work-at-Height", "Electrical", "Excavation", "Confined Space"]
    .map(n => ((p.jobNature || []).includes(n) ? "&#9746; " : "&#9744; ") + n)
    .join("&nbsp;&nbsp;&nbsp;");
  const c = p.checklist || {};
  const checks = [
    ["Are all personnel familiar with the associated risks and control measures?", c.personnelFamiliarWithRisks],
    ["Are all protective measures in place?", c.protectiveMeasuresInPlace],
    ["Do all personnel understand the emergency procedures?", c.emergencyProceduresUnderstood],
    ["Have all flammable materials and other combustibles been moved away from the area or covered?", c.flammablesRemovedOrCovered],
    ["Is all work equipment in good order?", c.equipmentInGoodOrder],
    ["Have sufficient fire extinguishers been provided?", c.fireExtinguishersProvided],
    ["Is all the required PPE issued and worn?", c.ppeIssuedAndWorn]
  ].map(([q, a]) => `<tr><td>${q}</td><td style="width:15%;text-align:center;">${a || ""}</td></tr>`).join("");
  const closed = data.closedAt ? new Date(data.closedAt).toLocaleString() : "";

  return `
    <div class="section-title">Permit to Work (${data.formCode || "CEWF-IMS-FRM-043"})</div>
    <table>
      <tr><td class="label">Location</td><td>${p.location || ""}</td></tr>
      <tr><td class="label">Manager in Charge</td><td>${p.permitIssuer || ""}</td></tr>
      <tr><td class="label">Job Nature</td><td>${nature}</td></tr>
      <tr><td class="label">Specification of Task</td><td>${p.taskSpecification || ""}</td></tr>
      <tr><td class="label">Timescale</td><td>Date: ${p.date || ""} &nbsp; Time: From ${p.timeFrom || ""} To ${p.timeTo || ""}</td></tr>
      <tr><td class="label">Hazards</td><td>${p.hazards || ""}</td></tr>
      <tr><td class="label">Control Measures</td><td>${p.controlMeasures || ""}</td></tr>
    </table>

    <div class="section-title">Management Checklist</div>
    <table>${checks}</table>

    <div class="section-title">Authorisation &amp; Cancellation</div>
    <table>
      <tr><td class="label">Permit Issued By</td><td>${p.permitIssuer || ""} ${p.issuerPosition ? "(" + p.issuerPosition + ")" : ""}</td></tr>
      <tr><td class="label">Permit Received By</td><td>${p.permitReceiver || ""} ${p.receiverPosition ? "(" + p.receiverPosition + ")" : ""}</td></tr>
      <tr><td class="label">Job Closed</td><td>${closed}</td></tr>
      <tr><td class="label">Permit Cancelled (area inspected)</td><td>${(p.cancelledAt || "").replace("T", " ")}</td></tr>
    </table>
  `;
}

const params = new URLSearchParams(window.location.search);
const dbId = params.get("db");
const recordKey = params.get("id");

if (!dbId || !recordKey) {
  document.getElementById("reportContent").innerHTML = "Invalid record.";
} else {

  firebase.database()
    .ref("safetyDeclarations/" + dbId + "/" + recordKey)
    .once("value")
    .then(snap => {

      const data = snap.val();

      if (!data) {
        document.getElementById("reportContent").innerHTML = "Record not found.";
        return;
      }

      const openDate = data.timestamp
        ? new Date(data.timestamp).toLocaleString()
        : "";

      const scoreClass = (data.checklistScore || 0) < 3
        ? "score-low"
        : "score-ok";

      document.getElementById("reportContent").innerHTML = `

        <div class="section-title">Basic Information</div>

        <table>
          <tr>
            <td class="label">DB Number</td>
            <td>${dbId}</td>
          </tr>
          <tr>
            <td class="label">Technician</td>
            <td>${data.electricianName || ""}</td>
          </tr>
          <tr>
            <td class="label">Date Opened</td>
            <td>${openDate}</td>
          </tr>
          <tr>
            <td class="label">Permit No</td>
            <td>${data.permitNo || ""}</td>
          </tr>
        </table>

        <div class="section-title">Safety Checklist</div>

        <table>
          <tr>
            <td class="label">PPE Worn</td>
            <td>${data.ppe || ""}</td>
          </tr>
          <tr>
            <td class="label">Main Isolation</td>
            <td>${data.isolation || ""}</td>
          </tr>
          <tr>
            <td class="label">Voltage Tested</td>
            <td>${data.voltageTest || ""}</td>
          </tr>
          <tr>
            <td class="label">2 Persons Present</td>
            <td>${data.lockout || ""}</td>
          </tr>
          <tr>
            <td class="label">Supervisor Informed</td>
            <td>${data.supervisor || ""}</td>
          </tr>
          <tr>
            <td class="label">Checklist Score</td>
            <td class="${scoreClass}">
              ${data.checklistScore || 0} / 5
            </td>
          </tr>
        </table>

        ${ptwHtml(data)}

        <div class="section-title">Safety Photo</div>

        ${data.safetyPhoto
          ? `<img src="${data.safetyPhoto}">`
          : `<p>No Photo Uploaded</p>`
        }
      `;
    });
}

</script>

</div>
</body>
</html>
