<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUX Survey</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="data.js"></script>
  <script src="pm-library.js"></script>
  <style>
    .card { max-width: 640px; margin: 14px auto; }
    #formArea { display: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .pt { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 12px; background: #fff; }
    .pt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pt-name { font-weight: 800; font-size: 15px; }
    .pt-lim { font-size: 12.5px; color: var(--muted); }
    .reading { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .reading input { font-size: 26px !important; font-weight: 800; text-align: center; padding: 10px !important; flex: 1; }
    .reading .unit { font-weight: 700; color: var(--muted); }
    .res { margin-top: 8px; min-height: 22px; }
    .photo-btn2 { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700;
                  border: 1px dashed #d6cfc6; border-radius: 8px; padding: 7px 10px; cursor: pointer; background: var(--surface-2); }
    .photo-btn2 input { display: none; }
    .thumb { max-width: 90px; max-height: 90px; border-radius: 8px; margin-top: 8px; display: none; border: 1px solid var(--border); }
    details.edit { margin-top: 8px; font-size: 13px; }
    details.edit summary { cursor: pointer; color: var(--muted); }
    .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 0 10px; }
    #submitBtn { width: 100%; margin-top: 16px; padding: 15px; font-size: 17px; }
    .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="topbar">
  <img src="logo.png" alt="Chenab Engineering Works &amp; Foundries (Pvt) Ltd.">
  <div class="title">LUX Survey</div>
</div>

<div class="card" id="loginCard">
  <h2>Login</h2>
  <input type="password" id="loginKey" placeholder="Enter password">
  <button class="btn btn-red" onclick="doLogin()" style="width:100%;margin-top:12px;">Login</button>
  <div id="loginError" style="color:#b42318;margin-top:10px;"></div>
</div>

<div id="formArea">
  <div class="card">
    <h2>1. Area</h2>
    <select id="areaSel" onchange="areaChanged()"></select>
    <input type="text" id="areaNew" placeholder="Type the new area name" style="display:none;margin-top:8px;">
    <p class="muted" id="areaInfo"></p>
  </div>

  <div class="card">
    <h2>2. Readings</h2>
    <p class="muted">Hold the meter at the working height (about 0.85 m / at the tool) and type the reading.</p>
    <div id="points"></div>
    <button class="btn btn-dark" style="width:100%;margin-top:12px;padding:11px;" onclick="addPoint()">＋ Add another point</button>
    <div class="summary" id="summary"></div>
  </div>

  <div class="card">
    <h2>3. Done by</h2>
    <div class="row2">
      <div><label>Name</label><input type="text" id="by" list="teamList"></div>
      <div><label>Date</label><input type="date" id="sDate"></div>
    </div>
    <datalist id="teamList"></datalist>
    <p class="muted" id="instrInfo"></p>
    <button class="btn btn-blue" id="submitBtn" onclick="submitLux()">Submit LUX Survey</button>
  </div>
</div>

<script>
const KEY = "9999";
const METER = EQUIPMENT.find(e => e.code === "EQ-ELM-DLM-001");
const startTime = (() => { const n = new Date(); return new Date(n - n.getTimezoneOffset() * 60000).toISOString().slice(11, 16); })();
let lastByArea = {}, photos = {}, pointSeq = 0;

if (sessionStorage.getItem("electricianLogged") === "true") showForm();
function doLogin() {
  if (document.getElementById("loginKey").value.trim() === KEY) { sessionStorage.setItem("electricianLogged", "true"); showForm(); }
  else document.getElementById("loginError").innerText = "Incorrect password!";
}

async function showForm() {
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("formArea").style.display = "block";
  document.getElementById("by").value = "Mansab Ali";                      // LUX project owner
  document.getElementById("sDate").value = ymd(new Date());
  document.getElementById("teamList").innerHTML = TEAM.map(t => `<option value="${esc(t[0])}">`).join("");
  document.getElementById("instrInfo").textContent = `Instrument: ${equipLabel(METER)}`;
  const all = Object.values((await db.ref("luxReports").once("value")).val() || {});
  all.forEach(r => {
    const k = (r.samplingLocation || "").trim();
    if (k && (!lastByArea[k] || (r.timestamp || "") > (lastByArea[k].timestamp || ""))) lastByArea[k] = r;
  });
  const areas = Object.keys(lastByArea).sort();
  document.getElementById("areaSel").innerHTML = `<option value="">– Choose area –</option>` +
    areas.map(a => `<option>${esc(a)}</option>`).join("") + `<option value="__new">＋ New area…</option>`;
  const pre = new URLSearchParams(location.search).get("area");
  if (pre && lastByArea[pre.trim()]) document.getElementById("areaSel").value = pre.trim();
  areaChanged();
}

function areaChanged() {
  const v = document.getElementById("areaSel").value;
  document.getElementById("areaNew").style.display = v === "__new" ? "" : "none";
  document.getElementById("points").innerHTML = "";
  photos = {}; pointSeq = 0;
  const last = lastByArea[v];
  if (last) {
    document.getElementById("areaInfo").textContent = `Last survey: ${last.sampleDate} by ${last.collectedBy || "–"}. Points loaded from it.`;
    (last.measurements || []).filter(Boolean).forEach(m => addPoint(m.point, m.limitLux));
  } else {
    document.getElementById("areaInfo").textContent = v === "__new" ? "New area – add the measuring points." : "";
    if (v) { addPoint("", ""); addPoint("", ""); addPoint("", ""); }
  }
  updateSummary();
}

function addPoint(name, limit) {
  const id = ++pointSeq;
  const div = document.createElement("div");
  div.className = "pt";
  div.id = "pt" + id;
  div.innerHTML = `
    <div class="pt-head"><div><div class="pt-name" id="pn${id}">${esc(name || "Point " + id)}</div>
      <div class="pt-lim">Limit: <b id="pl${id}">${esc(limit || "–")}</b> lux</div></div>
      <span style="color:#b42318;cursor:pointer;font-weight:800;" onclick="document.getElementById('pt${id}').remove();delete photos[${id}];updateSummary();">✕</span></div>
    <div class="reading"><input type="number" inputmode="decimal" step="0.1" id="pv${id}" placeholder="0" oninput="updateSummary()">
      <span class="unit">lux</span></div>
    <div class="res" id="pr${id}"></div>
    <label class="photo-btn2">📷 Meter photo (optional)<input type="file" accept="image/*" capture="environment" onchange="takePhoto(event, ${id})"></label>
    <img class="thumb" id="pi${id}">
    <details class="edit" ${name ? "" : "open"}><summary>Edit point name / limit</summary>
      <div class="row2"><input type="text" id="pnIn${id}" value="${esc(name || "")}" placeholder="Point name, e.g. Lathe machine"
          oninput="document.getElementById('pn${id}').textContent=this.value||'Point ${id}'">
        <input type="number" id="plIn${id}" value="${esc(limit || "")}" placeholder="Limit lux"
          oninput="document.getElementById('pl${id}').textContent=this.value||'–';updateSummary()"></div>
    </details>`;
  document.getElementById("points").appendChild(div);
}

// shrink photos to max 1000 px JPEG so the database stays fast
function takePhoto(e, id) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 1000 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    photos[id] = c.toDataURL("image/jpeg", 0.7);
    const t = document.getElementById("pi" + id);
    t.src = photos[id]; t.style.display = "block";
  };
  img.src = URL.createObjectURL(file);
}

function pointData() {
  return [...document.querySelectorAll(".pt")].map(div => {
    const id = div.id.slice(2);
    return { id, point: document.getElementById("pnIn" + id).value.trim(), limit: document.getElementById("plIn" + id).value.trim(),
             value: document.getElementById("pv" + id).value.trim() };
  });
}
function updateSummary() {
  let good = 0, low = 0;
  pointData().forEach(p => {
    const el = document.getElementById("pr" + p.id);
    if (p.value === "" || p.limit === "") { el.innerHTML = ""; return; }
    const ok = Number(p.value) >= Number(p.limit);
    ok ? good++ : low++;
    el.innerHTML = ok ? '<span class="badge badge-ok">GOOD – meets the limit</span>'
                      : `<span class="badge badge-bad">BELOW LIMIT – ${Math.round(Number(p.limit) - Number(p.value))} lux short</span>`;
  });
  document.getElementById("summary").innerHTML = (good ? `<span class="badge badge-ok">${good} good</span>` : "") +
    (low ? `<span class="badge badge-bad">${low} below limit</span>` : "");
}

function submitLux() {
  const sel = document.getElementById("areaSel").value;
  const area = sel === "__new" ? document.getElementById("areaNew").value.trim() : sel;
  if (!area) return alert("Choose the area.");
  const pts = pointData();
  if (!pts.length) return alert("Add at least one point.");
  if (pts.some(p => !p.point || p.limit === "")) return alert("Every point needs a name and a limit (open 'Edit point name / limit').");
  if (pts.some(p => p.value === "")) return alert("Type the reading for every point.");
  const by = document.getElementById("by").value.trim();
  if (!by) return alert("Enter your name.");
  const now = new Date();
  const person = TEAM.find(t => t[0] === by);
  const data = {
    samplingLocation: area, sampleDate: document.getElementById("sDate").value,
    timeFrom: startTime, timeTo: new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(11, 16),
    collectedBy: by, designation: person ? person[1] : "",
    equipmentUsed: `${METER.code} ${METER.name} (S/N ${METER.serial})`, model: METER.make,
    calibrationNo: METER.calCert || "", calibrationDate: METER.calDue || "",
    formCode: "CEWF-ADM-FRM-002", effectiveDate: "20-11-2025", issueNo: "01", revisionNo: "00",
    typeArea: "Area Survey", typeSpot: "",
    measurements: pts.map((p, i) => ({
      sn: i + 1, point: p.point, limitLux: p.limit, measuredLux: p.value,
      remarks: Number(p.value) >= Number(p.limit) ? "Good" : "Below limit – improve lighting",
      image: photos[p.id] || null
    }))
  };
  document.getElementById("submitBtn").disabled = true;
  saveLuxReport(data, () => {
    const low = data.measurements.filter(m => m.remarks !== "Good").length;
    alert(low ? `LUX survey saved. ${low} point(s) below limit – report to the supervisor.` : "LUX survey saved. All points good.");
    // manual-entry list is HOD-only; technicians return to a fresh LUX form
    location.href = sessionStorage.getItem("adminDashboardLogged") === "true" ? "forms.html?tab=lux" : "lux.html";
  });
}
</script>
</body>
</html>
