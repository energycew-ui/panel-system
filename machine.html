<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Maintenance</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="data.js"></script>
  <script src="pm-library.js"></script>
  <style>
    .card { max-width: 760px; margin: 16px auto; }
    .asset-title { font-size: 21px; font-weight: 800; margin: 0; }
    .asset-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .actions { display: grid; gap: 10px; margin-top: 4px; }
    .action {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: #fff; text-align: left; font-size: 16px; font-weight: 700; color: var(--text);
    }
    .action:hover { border-color: var(--brand); background: #fff6f5; }
    .action .ico { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); }
    .action small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .action.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .action.primary small { color: #ffe1e1; }
    .action.primary .ico { background: rgba(255,255,255,.18); }
    table.simple { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.simple td, table.simple th { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    table.simple th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="topbar">
  <img src="logo.png" alt="Chenab Engineering Works &amp; Foundries (Pvt) Ltd.">
  <div class="title">Machine Maintenance</div>
</div>

<div id="content"><div class="card"><p class="muted">Loading machine…</p></div></div>

<script>
const assetId = new URLSearchParams(location.search).get("id");

function render(a, records, tpm, faults) {
  if (!a) {
    document.getElementById("content").innerHTML =
      `<div class="card"><h2>Machine not found</h2><p class="muted">No machine with ID "${esc(assetId)}". Check the QR label.</p></div>`;
    return;
  }
  const cat = CATEGORIES[a.category];
  const strat = strategyFor(a);
  const cls = critClass(a.crit);
  const st = a.pmStatus || {};

  // PM status rows
  const rows = activeLevels(a).map(L => {
    const s = st[L] || {};
    const b = dueBadge(s.nextDue);
    return `<tr><td><b>${levelName(a, L)}</b></td><td style="white-space:nowrap;">${s.lastDone || "–"}</td><td style="white-space:nowrap;">${s.nextDue || "–"}</td>
            <td><span class="badge ${b.cls}">${b.text}</span></td></tr>`;
  }).join("");

  // breakdown history this year (faults on the linked DB matching this machine)
  const year = String(new Date().getFullYear());
  const mine = faults.filter(f => a.faultAlias && f.asset && f.asset.toLowerCase().startsWith(a.faultAlias.toLowerCase())
                                   && (f.startTime || f.timestamp || "").startsWith(year));
  const mins = mine.reduce((s, f) => s + (Number(f.downtimeMinutes) || 0), 0);
  const dayOfYear = Math.max(1, Math.round((new Date() - new Date(year + "-01-01T00:00:00")) / 86400000));
  const mtbf = mine.length ? Math.round(dayOfYear / mine.length) + " days" : "–";

  // last condition readings
  const last = records[0];
  let cbmHtml = '<p class="muted">No condition readings yet.</p>';
  if (last && last.cbm && Object.keys(last.cbm).length) {
    cbmHtml = `<table class="simple"><tr><th>Parameter</th><th>Reading</th><th>Status</th></tr>` +
      Object.entries(last.cbm).map(([k, v]) => `<tr><td>${esc((CBM_PARAMS[k] || {}).label || k)}</td>
        <td>${esc(v)} ${esc((CBM_PARAMS[k] || {}).unit || "")}</td><td>${statusBadgeCbm(cbmStatus(k, v))}</td></tr>`).join("") +
      `</table><p class="muted">From PM on ${esc(last.date)}</p>`;
  }

  const openTags = tpm.filter(t => t.tag === "red" && t.tagStatus !== "Closed");
  const recentHtml = records.slice(0, 5).map(r => `<tr><td>${esc(r.date)}</td><td>${esc(PM_LEVELS[r.level]?.short || r.level)}</td>
      <td>${esc(r.technician)}</td><td>${r.condition === "Good" ? '<span class="badge badge-ok">Good</span>'
        : r.condition === "Critical" ? '<span class="badge badge-bad">Critical</span>' : `<span class="badge badge-warn">${esc(r.condition)}</span>`}</td></tr>`).join("");

  const oos = a.status === "Out of Service";
  document.getElementById("content").innerHTML = `
    <div class="card">
      <p class="asset-title">${esc(a.name)}</p>
      <div class="asset-meta">Machine ID <b>${esc(a.id)}</b> · ${esc(a.area)} · ${esc(cat.name)} · ${esc(a.manufacturer)} (${esc(a.yom)})</div>
      <div class="chips">
        ${critBadge(a)}
        <span class="badge badge-info">${esc(strat.name)}</span>
        <span class="badge ${oos ? "badge-bad" : "badge-ok"}">${esc(a.status)}</span>
        ${a.linkedDb ? `<span class="badge badge-info">Fed from ${esc(a.linkedDb)}</span>` : ""}
      </div>
      <p class="muted" style="margin:10px 0 0;">${esc(CRIT_TEXT[cls])}</p>
    </div>

    <div class="card">
      <div class="actions">
        <button class="action" onclick="location.href='tpm.html?id=${encodeURIComponent(a.id)}'" ${oos ? "disabled" : ""}>
          <span class="ico">🧑‍🏭</span><span>Operator Daily Check (TPM)<small>Clean · Lubricate · Inspect · Tighten – raise a red tag</small></span></button>
        <button class="action primary" onclick="location.href='pm.html?id=${encodeURIComponent(a.id)}'" ${oos ? "disabled" : ""}>
          <span class="ico">🛠️</span><span>Preventive Maintenance Work Order<small>Technician – checklist and condition readings</small></span></button>
        ${a.linkedDb ? `<button class="action" onclick="location.href='safety.html?id=${encodeURIComponent(a.linkedDb)}'">
          <span class="ico">⚡</span><span>Report Electrical Breakdown<small>Permit to work, then fault report on ${esc(a.linkedDb)}</small></span></button>` : ""}
      </div>
    </div>

    ${oos ? "" : `<div class="card">
      <h2>Maintenance Schedule</h2>
      ${rows ? `<table class="simple"><tr><th>Level</th><th>Last done</th><th>Next due</th><th>Status</th></tr>${rows}</table>`
             : `<p class="muted">No fixed routine for this machine – the HOD adds its PM to the weekly work plan when needed.</p>`}
      <p class="muted"><b>Routine:</b> ${esc(routineText(a))}</p>
    </div>`}

    <div class="card">
      <h2>Reliability (${year})</h2>
      <div class="stat-row">
        <div class="stat"><b>${mine.length}</b><span>Breakdowns</span></div>
        <div class="stat"><b>${mins}</b><span>Downtime (min)</span></div>
        <div class="stat"><b>${mtbf}</b><span>MTBF</span></div>
      </div>
      ${openTags.length ? `<p style="margin-top:12px;"><span class="badge badge-bad">${openTags.length} open red tag(s)</span>
        ${openTags.map(t => esc(t.description || "")).join("; ")}</p>` : ""}
    </div>

    <div class="card">
      <h2>Latest Condition Readings</h2>
      ${cbmHtml}
    </div>

    <div class="card">
      <h2>Recent Maintenance</h2>
      ${records.length ? `<table class="simple"><tr><th>Date</th><th>Level</th><th>Technician</th><th>Condition</th></tr>${recentHtml}</table>`
                       : '<p class="muted">No PM recorded yet.</p>'}
    </div>`;
}

(async function () {
  if (!assetId) {
    document.getElementById("content").innerHTML = '<div class="card"><h2>No machine selected</h2><p class="muted">Scan the QR label on the machine.</p></div>';
    return;
  }
  const a = (await db.ref("assets/" + assetId).once("value")).val();
  if (!a) return render(null);
  const recs = Object.values((await db.ref("pmRecords/" + assetId).once("value")).val() || {})
    .sort((x, y) => (y.timestamp || "").localeCompare(x.timestamp || ""));
  const tpm = Object.values((await db.ref("tpmChecks/" + assetId).once("value")).val() || {});
  let faults = [];
  if (a.linkedDb) faults = Object.values((await db.ref("faults/" + a.linkedDb).once("value")).val() || {});
  render(a, recs, tpm, faults);
})();
</script>
</body>
</html>
