<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earthing Inspection</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="data.js"></script>
  <script src="pm-library.js"></script>
  <style>
    .card { max-width: 820px; margin: 16px auto; }
    #formArea { display: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
    .checks label.inl { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; margin-right: 14px; }
    .pit { border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px 14px; margin-top: 12px; background: var(--surface-2); }
    .pit h3 { margin: 12px 0 0; border: none !important; padding: 0 !important; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pit .last { font-size: 12px; color: var(--muted); font-weight: 500; }
    .ck { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .seg { display: inline-flex; border: 1px solid #d6cfc6; border-radius: 8px; overflow: hidden; }
    .seg button { border: none; border-radius: 0 !important; padding: 7px 12px; font-size: 13px; background: #fff; color: var(--text); margin: 0; }
    .seg button + button { border-left: 1px solid #d6cfc6; }
    .seg button.on.y { background: #12a150; color: #fff; }
    .seg button.on.n { background: #fd0000; color: #fff; }
    .result { font-size: 13px; font-weight: 700; margin-top: 6px; }
    #submitBtn { width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="topbar">
  <img src="logo.png" alt="Chenab Engineering Works &amp; Foundries (Pvt) Ltd.">
  <div class="title">Earthing Inspection</div>
</div>

<div class="card" id="loginCard">
  <h2>Electrician Login</h2>
  <input type="password" id="loginKey" placeholder="Enter password">
  <button class="btn btn-red" onclick="doLogin()" style="width:100%;margin-top:12px;">Login</button>
  <div id="loginError" style="color:#b42318;margin-top:10px;"></div>
</div>

<div id="formArea">
  <div class="card">
    <h2>Test Details</h2>
    <p class="muted">Acceptance criterion: ≤ 5.0 Ω = Satisfactory (S); &gt; 5.0 Ω = Not Satisfactory (NS) – report to Supervisor immediately.
      Ref. IEC 60364-6, IEC 61557-5, IEEE 81.</p>
    <div class="row2">
      <div><label>Inspection date</label><input type="date" id="eDate"></div>
      <div class="row2" style="gap:0 8px;">
        <div><label>From</label><input type="time" id="eFrom"></div>
        <div><label>To</label><input type="time" id="eTo"></div>
      </div>
    </div>
    <div class="row2">
      <div><label>Tested by *</label><input type="text" id="tester" list="teamList"></div>
      <div><label>Designation</label><input type="text" id="desig"></div>
    </div>
    <datalist id="teamList"></datalist>
    <div class="row2">
      <div><label>Earth tester (from equipment master list)</label><select id="instr"></select></div>
      <div><label>Serial No.</label><input type="text" id="serial" readonly></div>
    </div>
    <div class="row2">
      <div><label>Calibration cert. No.</label><input type="text" id="calNo"></div>
      <div><label>Calibration due date</label><input type="date" id="calDue"></div>
    </div>
    <label>Test method</label>
    <div class="checks">
      <label class="inl"><input type="radio" name="method" value="3-Point (Fall of Potential)" checked> 3-Point (Fall of Potential)</label>
      <label class="inl"><input type="radio" name="method" value="Clamp-on"> Clamp-on</label>
      <label class="inl"><input type="radio" name="method" value="Other"> Other</label>
    </div>
    <label>Soil / weather</label>
    <div class="checks">
      <label class="inl"><input type="radio" name="soil" value="Dry" checked> Dry</label>
      <label class="inl"><input type="radio" name="soil" value="Moist"> Moist</label>
      <label class="inl"><input type="radio" name="soil" value="Wet"> Wet</label>
      <label class="inl"><input type="checkbox" id="rain"> Rain in last 48 h</label>
    </div>
  </div>

  <div class="card">
    <h2>Earth Resistance Readings</h2>
    <div id="pits"><p class="muted">Loading earth pits…</p></div>
  </div>

  <div class="card">
    <h2>Observations / Corrective Action</h2>
    <textarea id="obs" placeholder="Observations, nonconformities and corrective action required"></textarea>
    <button class="btn btn-blue" id="submitBtn" onclick="submitEarth()">Submit Earthing Inspection</button>
  </div>
</div>

<script>
const ELEC_KEY = "9999";
const onePit = new URLSearchParams(location.search).get("id");
let pits = [], checks = {};

if (sessionStorage.getItem("electricianLogged") === "true") showForm();
function doLogin() {
  if (document.getElementById("loginKey").value.trim() === ELEC_KEY) {
    sessionStorage.setItem("electricianLogged", "true"); showForm();
  } else document.getElementById("loginError").innerText = "Incorrect password!";
}

async function showForm() {
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("formArea").style.display = "block";
  document.getElementById("teamList").innerHTML = TEAM.map(t => `<option value="${esc(t[0])}">`).join("");
  document.getElementById("tester").onchange = e => {
    const t = TEAM.find(x => x[0] === e.target.value.trim());
    if (t) document.getElementById("desig").value = t[1];
  };
  const now = new Date();
  document.getElementById("eDate").value = ymd(now);
  document.getElementById("eFrom").value = new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(11, 16);
  // earth testers first, then other equipment (e.g. multimeter for continuity)
  const instr = document.getElementById("instr");
  instr.innerHTML = [...EQUIPMENT].sort((a, b) => (b.use.includes("earth") - a.use.includes("earth")))
    .map(e => `<option value="${e.code}">${esc(e.code + " – " + e.name + ", " + e.make)}</option>`).join("");
  instr.value = EARTH_INSTRUMENT.code;
  const setSerial = () => document.getElementById("serial").value = EQUIPMENT.find(e => e.code === instr.value).serial;
  instr.onchange = setSerial;
  setSerial();

  const all = (await db.ref("earthPits").once("value")).val() || {};
  pits = Object.values(all).sort((a, b) => a.id.localeCompare(b.id));
  if (onePit) pits = pits.filter(p => p.id === onePit);
  if (!pits.length) { document.getElementById("pits").innerHTML = `<p class="muted">Earth pit "${esc(onePit)}" not found.</p>`; return; }
  document.getElementById("pits").innerHTML = pits.map(p => `
    <div class="pit" id="pit_${p.id}">
      <h3><span>${esc(p.id)} · ${esc(p.name)}</span>
        <span class="last">Last: ${p.lastReading != null ? esc(p.lastReading) + " Ω on " + esc(p.lastDate) : "–"}</span></h3>
      <div class="row2">
        <div><label>Measured resistance (Ω) *</label>
          <input type="number" step="0.01" min="0" id="r_${p.id}" oninput="liveResult('${p.id}')"></div>
        <div><label>Visual condition (pit, clamp, cable)</label>
          <select id="v_${p.id}"><option value="">Select</option><option>OK</option><option>Not OK</option></select></div>
      </div>
      <div class="result" id="res_${p.id}"></div>
      ${EARTH_CHECKS.map(([k, t]) => `
        <div class="ck"><div>${esc(t)}</div>
          <div class="seg" id="ck_${p.id}_${k}">
            <button class="y" onclick="ck('${p.id}','${k}','Yes')">Yes</button>
            <button class="n" onclick="ck('${p.id}','${k}','No')">No</button>
          </div></div>`).join("")}
      <label>Remarks</label><input type="text" id="rm_${p.id}">
    </div>`).join("");
}

function liveResult(id) {
  const v = parseFloat(document.getElementById("r_" + id).value);
  document.getElementById("res_" + id).innerHTML = isNaN(v) ? "" :
    v <= EARTH_LIMIT ? '<span class="badge badge-ok">S – Satisfactory</span>'
                     : '<span class="badge badge-bad">NS – Not Satisfactory · report to Supervisor</span>';
}
function ck(pid, k, v) {
  checks[pid] = checks[pid] || {};
  checks[pid][k] = v;
  const seg = document.getElementById(`ck_${pid}_${k}`);
  seg.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  seg.querySelector(v === "Yes" ? ".y" : ".n").classList.add("on");
}

async function submitEarth() {
  const tester = document.getElementById("tester").value.trim();
  if (!tester) return alert("Enter tester name.");
  for (const p of pits) {
    if (document.getElementById("r_" + p.id).value === "") return alert(`Enter the resistance for ${p.id} ${p.name}.`);
    if (!document.getElementById("v_" + p.id).value) return alert(`Select visual condition for ${p.id}.`);
    if (Object.keys(checks[p.id] || {}).length < EARTH_CHECKS.length) return alert(`Complete the visual checklist for ${p.id}.`);
  }
  const date = document.getElementById("eDate").value;
  const now = new Date();
  const common = {
    date, timestamp: now.toISOString(),
    timeFrom: document.getElementById("eFrom").value,
    timeTo: document.getElementById("eTo").value || new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(11, 16),
    testedBy: tester, designation: document.getElementById("desig").value.trim(),
    instrument: equipLabel(EQUIPMENT.find(e => e.code === document.getElementById("instr").value)),
    instrumentCode: document.getElementById("instr").value,
    calibrationNo: document.getElementById("calNo").value.trim(), calibrationDue: document.getElementById("calDue").value,
    method: document.querySelector("input[name=method]:checked").value,
    soil: document.querySelector("input[name=soil]:checked").value + (document.getElementById("rain").checked ? ", rain in last 48 h" : ""),
    observation: document.getElementById("obs").value.trim()
  };
  const upd = {};
  let ns = [];
  pits.forEach(p => {
    const r = Number(document.getElementById("r_" + p.id).value);
    const result = r <= EARTH_LIMIT ? "S" : "NS";
    if (result === "NS") ns.push(`${p.id} ${p.name} (${r} Ω)`);
    const key = db.ref().push().key;
    upd[`earthingReports/${p.id}/${key}`] = {
      ...common, pitId: p.id, pitName: p.name, resistance: r, result,
      visual: document.getElementById("v_" + p.id).value, checklist: checks[p.id],
      remarks: document.getElementById("rm_" + p.id).value.trim(),
      caStatus: result === "NS" || document.getElementById("v_" + p.id).value === "Not OK" ? "Open" : ""
    };
    upd[`earthPits/${p.id}/lastReading`] = r;
    upd[`earthPits/${p.id}/lastDate`] = date;
    upd[`earthPits/${p.id}/lastResult`] = result;
    upd[`earthPits/${p.id}/nextDue`] = addDays(date, 30);
  });
  document.getElementById("submitBtn").disabled = true;
  try {
    await db.ref().update(upd);
    alert(ns.length ? "Saved. NOT SATISFACTORY: " + ns.join(", ") + " – inform the Supervisor now." : "Earthing inspection saved. All points satisfactory.");
    location.href = onePit ? "earthing.html?id=" + encodeURIComponent(onePit) : "earthing.html";
  } catch (e) {
    document.getElementById("submitBtn").disabled = false;
    alert("Error saving: " + e.message);
  }
}
</script>
</body>
</html>
